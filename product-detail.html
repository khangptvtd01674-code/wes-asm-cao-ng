<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container {
            background: #fff; padding: 40px; border-radius: var(--radius);
            box-shadow: var(--shadow); display: flex; gap: 40px; margin-bottom: 40px;
        }
        .detail-image { flex: 1; text-align: center; }
        .detail-image img { max-width: 100%; height: auto; max-height: 500px; object-fit: contain; }
        .detail-info { flex: 1; }
        .detail-info h1 { font-size: 28px; margin-bottom: 15px; color: var(--dark-color); }
        .price-box { margin-bottom: 20px; }
        .price-box .price { font-size: 28px; color: var(--danger); font-weight: bold; }
        .price-box .old-price { font-size: 18px; color: #999; text-decoration: line-through; margin-left: 15px; }
        .detail-desc { font-size: 16px; color: #555; margin-bottom: 25px; line-height: 1.8; }
        
        .quantity-box { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .quantity-control { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .quantity-control button { width: 40px; height: 40px; background: #f8f9fa; border: none; cursor: pointer; font-size: 18px; }
        .quantity-control button:hover { background: #e2e6ea; }
        .quantity-control input { width: 50px; text-align: center; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); font-size: 16px; font-weight: bold; outline: none; }
        
        .action-btns { display: flex; gap: 15px; }
        .btn-add-cart { padding: 15px 30px; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; flex: 1; transition: var(--transition); }
        .btn-add-cart:hover { background: #0056b3; }
        .btn-buy-now { padding: 15px 30px; background: var(--danger); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; flex: 1; transition: var(--transition); }
        .btn-buy-now:hover { background: #c0392b; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><a href="index.html">TECH<span>ZONE</span></a></div>
            <div class="header-actions">
                <a href="cart.html" class="action-btn"><i class="fas fa-shopping-cart"></i>Giỏ hàng<span id="cartCount" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <div class="container section">
        <div class="product-detail-container" id="detailContainer">
            <!-- Injected by JS -->
        </div>

        <div class="section-header">
            <h2>SẢN PHẨM LIÊN QUAN</h2>
        </div>
        <div class="product-grid" id="relatedProducts"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
