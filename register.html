<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - TECHZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .auth-container h2 { text-align: center; margin-bottom: 30px; color: var(--dark-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; transition: var(--transition); }
        .form-group input:focus { border-color: var(--primary-color); outline: none; }
        .error-msg { color: var(--danger); font-size: 12px; margin-top: 5px; display: none; }
        .btn-auth { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: var(--transition); font-size: 16px; margin-top: 10px; }
        .btn-auth:hover { background: #0056b3; }
        .auth-link { display: block; text-align: center; margin-top: 20px; color: var(--primary-color); font-size: 14px; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><a href="index.html" style="margin: 0 auto;">TECH<span>ZONE</span></a></div>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" id="regName" placeholder="Nhập họ và tên">
                    <div class="error-msg" id="errRegName">Vui lòng nhập họ tên</div>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="text" id="regEmail" placeholder="Nhập email">
                    <div class="error-msg" id="errRegEmail">Email không đúng định dạng</div>
                </div>
                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="text" id="regPhone" placeholder="Nhập số điện thoại">
                    <div class="error-msg" id="errRegPhone">Số điện thoại không hợp lệ</div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu *</label>
                    <input type="password" id="regPassword" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)">
                    <div class="error-msg" id="errRegPassword">Mật khẩu phải tối thiểu 6 ký tự</div>
                </div>
                <div class="form-group">
                    <label>Nhập lại mật khẩu *</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Nhập lại mật khẩu">
                    <div class="error-msg" id="errRegPasswordConfirm">Mật khẩu không trùng khớp</div>
                </div>
                
                <button type="submit" class="btn-auth">ĐĂNG KÝ</button>
            </form>
            <a href="login.html" class="auth-link">Đã có tài khoản? Đăng nhập</a>
        </div>
    </div>

    <!-- Modal Success -->
    <div id="regSuccessModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:8px; text-align:center; max-width:400px;">
            <i class="fas fa-check-circle" style="font-size:60px; color:var(--success); margin-bottom:20px;"></i>
            <h2 style="margin-bottom:10px;">Đăng ký thành công!</h2>
            <p style="margin-bottom:20px;">Bạn đã có thể đăng nhập ngay bây giờ.</p>
            <a href="login.html" class="btn-auth" style="display:inline-block; text-decoration:none;">Đăng nhập ngay</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
