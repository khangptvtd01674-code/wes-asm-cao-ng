<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TECHZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .auth-container h2 { text-align: center; margin-bottom: 30px; color: var(--dark-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; transition: var(--transition); }
        .form-group input:focus { border-color: var(--primary-color); outline: none; }
        .error-msg { color: var(--danger); font-size: 12px; margin-top: 5px; display: none; }
        .btn-auth { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: var(--transition); font-size: 16px; margin-top: 10px; }
        .btn-auth:hover { background: #0056b3; }
        .auth-link { display: block; text-align: center; margin-top: 20px; color: var(--primary-color); font-size: 14px; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><a href="index.html" style="margin: 0 auto;">TECH<span>ZONE</span></a></div>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h2>ĐĂNG NHẬP</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email / Số điện thoại</label>
                    <input type="text" id="loginUsername" placeholder="Nhập email hoặc số điện thoại">
                    <div class="error-msg" id="errLoginUsername">Vui lòng nhập trường này</div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
                    <div class="error-msg" id="errLoginPassword">Vui lòng nhập mật khẩu</div>
                </div>
                <div id="loginGlobalError" class="error-msg" style="text-align: center; margin-bottom: 15px; font-size: 14px;">Tài khoản hoặc mật khẩu không đúng!</div>
                <button type="submit" class="btn-auth">ĐĂNG NHẬP</button>
            </form>
            <a href="register.html" class="auth-link">Chưa có tài khoản? Đăng ký ngay</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
